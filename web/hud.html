<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>JARVIS HUD</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<!-- Only external dependency this kiosk view has — see docs/UI_INTEGRATION.md
     for the tradeoff (offline kiosk vs. typography) and the self-hosting
     alternative. Everything else (hud.css, hud.js) is same-origin. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@500;600&display=swap">
<link rel="stylesheet" href="/hud.css?v=2">
</head>
<body>

<div id="hud-root" class="hud-root" data-state="offline">

  <!-- ============================================================
       Central JARVIS eye — layered SVG, all animation driven by
       hud.js via CSS custom properties + direct attribute updates.
       See docs/UI_INTEGRATION.md for the state contract and
       CONFIG in hud.js for every tunable visual parameter.

       Layer order (back to front) — each is a distinct depth plane,
       not decoration for its own sake:
         backdrop            ambient bloom
         particles           3 depth bands, state-dependent drift
         ring-outer-tech     static reference ring + fine tick marks
         ring-tool-sector    directional arc, tool_execution only
         ring-primary        static reference ring (anchor — never rotates)
         ring-rotor-a        slow dashed rotor (clockwise)
         ring-rotor-b        segmented rotor (counter-clockwise)
         ring-markers        asymmetric marker ring (idle flicker /
                              thinking chase / tool pulse)
         ring-energy         audio-reactive outer energy contour
         membrane            tight reactive ring around the core
                              (listening = inward bias, speaking = outward)
         wake-shockwave      one-shot expanding ring, wake_detected only
         core-group          energy-core wash + inner nucleus
         scan-sweep          slow rotating wedge (thinking / transcribing)
         ring-error          thin outer accent, error only
  ============================================================= -->
  <div class="eye-stage">
    <svg id="eye" class="eye" viewBox="-300 -300 600 600" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <defs>
        <filter id="glow-soft" x="-150%" y="-150%" width="400%" height="400%">
          <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="blur1"/>
          <feMerge><feMergeNode in="blur1"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
        <filter id="glow-strong" x="-220%" y="-220%" width="540%" height="540%">
          <feGaussianBlur in="SourceGraphic" stdDeviation="16" result="blur2"/>
          <feMerge><feMergeNode in="blur2"/><feMergeNode in="blur2"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
        <filter id="glow-nucleus" x="-300%" y="-300%" width="700%" height="700%">
          <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur3"/>
          <feMerge><feMergeNode in="blur3"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
        <radialGradient id="core-gradient" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="var(--eye-core-center)"/>
          <stop offset="45%" stop-color="var(--eye-core-mid)"/>
          <stop offset="100%" stop-color="var(--eye-core-edge)" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="nucleus-gradient" cx="45%" cy="42%" r="60%">
          <stop offset="0%" stop-color="#ffffff"/>
          <stop offset="100%" stop-color="var(--eye-core-center)"/>
        </radialGradient>
        <radialGradient id="backdrop-gradient" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="var(--eye-backdrop-center)"/>
          <stop offset="100%" stop-color="var(--eye-backdrop-edge)" stop-opacity="0"/>
        </radialGradient>
      </defs>

      <circle id="backdrop" cx="0" cy="0" r="280" fill="url(#backdrop-gradient)"/>

      <g id="particles-far" class="particles particles-far"></g>
      <g id="particles-mid" class="particles particles-mid"></g>
      <g id="particles-near" class="particles particles-near"></g>

      <g id="ring-outer-tech" class="ring ring-outer-tech">
        <circle cx="0" cy="0" r="252" class="ring-track"/>
        <circle cx="0" cy="0" r="244" class="ring-track ring-track-thin"/>
        <g id="ticks-outer"></g>
      </g>

      <g id="ring-tool-sector" class="ring-tool-sector">
        <path id="tool-sector-arc" d="" />
      </g>

      <g id="ring-primary" class="ring ring-primary">
        <circle cx="0" cy="0" r="222" class="ring-primary-line"/>
        <g id="primary-diamonds"></g>
      </g>

      <g id="ring-rotor-a" class="ring ring-rotor-a">
        <circle cx="0" cy="0" r="200" class="ring-dashed"/>
      </g>

      <g id="ring-rotor-b" class="ring ring-rotor-b">
        <circle cx="0" cy="0" r="176" class="ring-segmented"/>
      </g>

      <g id="ring-markers" class="ring ring-markers">
        <g id="markers-inner"></g>
      </g>

      <g id="ring-energy" class="ring ring-energy" filter="url(#glow-soft)">
        <path id="ring-energy-wave" class="ring-energy-wave" d=""/>
      </g>

      <g id="membrane-group" class="membrane-group">
        <path id="membrane" class="membrane" d=""/>
      </g>

      <circle id="wake-shockwave" class="wake-shockwave" cx="0" cy="0" r="86"/>
      <circle id="interrupt-flash" class="interrupt-flash" cx="0" cy="0" r="86"/>

      <g id="core-group" filter="url(#glow-strong)">
        <circle id="core" cx="0" cy="0" r="78" fill="url(#core-gradient)"/>
      </g>
      <g id="nucleus-group" filter="url(#glow-nucleus)">
        <circle id="nucleus" cx="0" cy="0" r="20" fill="url(#nucleus-gradient)"/>
        <path id="nucleus-shimmer" class="nucleus-shimmer" d=""/>
      </g>

      <g id="scan-sweep" class="scan-sweep">
        <path d="M 0 0 L 0 -252 A 252 252 0 0 1 52 -246 Z"/>
      </g>

      <circle id="ring-error" cx="0" cy="0" r="236" class="ring-error"/>
    </svg>
  </div>

  <!-- ============================================================
       HUD info overlay — deliberately sparse. The eye stays the
       focal point; these are peripheral readouts, not a dashboard.
  ============================================================= -->
  <header class="hud-topbar">
    <div class="hud-brand">JARVIS</div>
    <div class="hud-clock" id="hud-clock">--:--</div>
  </header>

  <div class="hud-status-line">
    <span class="hud-status-dot" id="hud-status-dot"></span>
    <span class="hud-status-text" id="hud-status-text">Offline</span>
  </div>

  <div class="hud-corner hud-corner-bl" id="hud-user-block">
    <div class="hud-label">Benutzer</div>
    <div class="hud-value" id="hud-user"></div>
  </div>

  <div class="hud-corner hud-corner-br" id="hud-mode-block">
    <div class="hud-label">Modus</div>
    <div class="hud-value" id="hud-mode">Lokal</div>
  </div>

  <div class="hud-command" id="hud-command" hidden></div>

  <!-- ============================================================
       Demo / debug control panel — only rendered when ?demo=1.
       Lets every state (and a synthetic speaking envelope) be
       triggered without a running backend, for visual tuning.
  ============================================================= -->
  <div class="hud-demo-panel" id="demo-panel" hidden>
    <div class="hud-demo-title">Demo-Modus</div>
    <div class="hud-demo-grid" id="demo-state-buttons"></div>
    <label class="hud-demo-row">
      <span>Pegel</span>
      <input type="range" id="demo-audio-level" min="0" max="100" value="40">
    </label>
    <label class="hud-demo-row">
      <input type="checkbox" id="demo-reduced-motion">
      <span>Reduzierte Bewegung testen</span>
    </label>
    <div class="hud-demo-hint">?demo=1, im Normalbetrieb nicht sichtbar</div>
  </div>
</div>

<script src="/hud.js?v=2"></script>
</body>
</html>
